name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: localhand
          POSTGRES_PASSWORD: localhand
          POSTGRES_DB: localhand_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localhand"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://localhand:localhand@localhost:5432/localhand_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-123456
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install OpenSpec
        run: |
          curl -fsSL https://openspec.dev/cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
