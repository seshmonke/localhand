services:
  db:
    image: postgres:18-alpine
    container_name: localhand-db
    environment:
      POSTGRES_USER: localhand
      POSTGRES_PASSWORD: localhand
      POSTGRES_DB: localhand
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localhand -d localhand"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
